worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker resolver — used here only for the (lack of) variable
    # hostnames; all upstream blocks point at 127.0.0.1:8XXX which gost
    # set up in entrypoint.sh.
    resolver 127.0.0.11 ipv6=off valid=300s;
    resolver_timeout 10s;

    proxy_cache_path /var/cache/nginx/maven
        levels=1:2
        keys_zone=maven:64m
        max_size=40g
        inactive=180d
        use_temp_path=off;

    # Big buffers — NeoForge installer is ~7 MB, mod jars up to 60+ MB.
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 1024m;

    # SNI to upstream over the gost relay. proxy_ssl_name is set per
    # location so the cert validation against the real CDN works.
    proxy_ssl_server_name on;

    # Actually verify that certificate. nginx defaults proxy_ssl_verify
    # to OFF, which meant every upstream here accepted any certificate
    # from anyone who could answer on the gost relay port — and the
    # responses land in a 180-day cache. A poisoned
    # `*-installer.jar` cached under that TTL is executed by
    # mc-image-helper on every server that installs a loader, so this
    # was a cache-poisoning-to-RCE path, not just a privacy issue.
    # Verification matches against proxy_ssl_name (the real CDN
    # hostname), not the 127.0.0.1 relay address we dial.
    #
    # Depth 5 rather than the default 1: the chain must still terminate
    # at a root in the trusted bundle, depth only bounds how many
    # intermediates we tolerate. CDNs re-issue intermediates without
    # warning and a too-tight depth turns that into a production
    # outage on loader downloads.
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 5;

    # Cache hardening — global, so every `location` with `proxy_cache
    # maven` inherits it.
    #
    # The Mojang / bmclapi / Azure CDN upstream chain loves stamping
    # short Cache-Control max-ages (Mojang piston-meta sends 120s),
    # Vary: Accept-Encoding (turns one cache entry into N), and
    # occasional Set-Cookie noise. nginx by default obeys those over
    # our own proxy_cache_valid, which silently turns "180-day cache"
    # into "expires after 2 minutes". Ignoring them lets the per-
    # location TTL we set actually stick.
    proxy_ignore_headers
        Cache-Control
        Set-Cookie
        Expires
        X-Accel-Expires
        Vary;
    # When multiple clients ask for the same MISS at once, only the
    # first goes upstream; the rest wait. Without lock, a thundering
    # herd of HMCL launchers on first install can stack hundreds of
    # duplicate upstream fetches against bmclapi / Mojang.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;

    # Trust Caddy's X-Forwarded-For so limits key on the real client.
    #
    # Without this every public request carries the Caddy container's
    # address, so the whole mirror shares one bucket: an abuser isn't
    # isolated, and a legitimate vanilla launch (~2600 asset objects
    # fetched in parallel) trips the limit for everyone.
    #
    # Rendered from TRUSTED_PROXY_CIDR at container start. Left unset it
    # is empty and nginx keeps using the socket peer — safe, just
    # coarse. Never set this to 0.0.0.0/0: any client could then spoof
    # its own key and bypass the limits entirely.
    ${NGINX_REAL_IP_BLOCK}

    # Rate + concurrency limits. In prod this server is published
    # through Caddy as a launcher mirror, so it is internet-facing and
    # unauthenticated: every MISS costs an upstream CDN fetch and up to
    # 500 MB of disk. Without a limit, one client can both amplify
    # traffic through the operator's relay and evict the 40 GB cache.
    #
    # Sized for the real workload: a first vanilla launch pulls a few
    # thousand small asset objects over a handful of connections, so
    # 100 r/s with a 300 burst is comfortable for a genuine client and
    # still bounds a scripted cache-buster.
    limit_req_zone $binary_remote_addr zone=mirror_req:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=mirror_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    log_format cache '$remote_addr $upstream_cache_status $request '
                     '→ $proxy_host (HTTP $status, ${request_time}s)';
    access_log /var/log/nginx/access.log cache;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        limit_req zone=mirror_req burst=300 nodelay;
        limit_conn mirror_conn 64;

        # This is a read-only mirror. Anything else was being relayed
        # verbatim to Mojang / CurseForge from the operator's IP.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # nginx runtime counters. In prod this server also sits on the
        # shared caddy network so the operator can publish /mirror/* to
        # launchers — keep the status page off that surface.
        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        # ------- NeoForge maven (releases + libraries) -------------
        location /neoforge/ {
            proxy_pass https://127.0.0.1:8001/;
            proxy_set_header Host maven.neoforged.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.neoforged.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "neoforge:$uri";
            proxy_cache_use_stale error timeout updating http_502 http_503;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------- Forge maven --------------------------------------
        location /forge/ {
            proxy_pass https://127.0.0.1:8002/;
            proxy_set_header Host maven.minecraftforge.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.minecraftforge.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "forge:$uri";
            proxy_cache_use_stale error timeout updating http_502 http_503;
            proxy_read_timeout 300s;
            add_header X-Cache-Status $upstream_cache_status;
        }
        location /forge-files/ {
            proxy_pass https://127.0.0.1:8003/;
            proxy_set_header Host files.minecraftforge.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name files.minecraftforge.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "forge-files:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------- Fabric -------------------------------------------
        location /fabric-meta/ {
            proxy_pass https://127.0.0.1:8004/;
            proxy_set_header Host meta.fabricmc.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name meta.fabricmc.net;
            proxy_cache maven;
            # Meta JSON updates with new builds — keep TTL shorter.
            proxy_cache_valid 200 206 1h;
            proxy_cache_valid 404 5m;
            proxy_cache_key "fabric-meta:$request_uri";
            proxy_cache_use_stale error timeout updating http_502 http_503;
            add_header X-Cache-Status $upstream_cache_status;
        }
        location /fabric/ {
            proxy_pass https://127.0.0.1:8005/;
            proxy_set_header Host maven.fabricmc.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.fabricmc.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "fabric:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------- Quilt --------------------------------------------
        location /quilt-meta/ {
            proxy_pass https://127.0.0.1:8006/;
            proxy_set_header Host meta.quiltmc.org;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name meta.quiltmc.org;
            proxy_cache maven;
            proxy_cache_valid 200 206 1h;
            proxy_cache_valid 404 5m;
            proxy_cache_key "quilt-meta:$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }
        location /quilt/ {
            proxy_pass https://127.0.0.1:8007/;
            proxy_set_header Host maven.quiltmc.org;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.quiltmc.org;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "quilt:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------- Mojang piston-data + piston-meta -----------------
        location /piston-data/ {
            proxy_pass https://127.0.0.1:8008/;
            proxy_set_header Host piston-data.mojang.com;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name piston-data.mojang.com;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "piston-data:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }
        location /piston-meta/ {
            proxy_pass https://127.0.0.1:8009/;
            proxy_set_header Host piston-meta.mojang.com;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name piston-meta.mojang.com;
            proxy_cache maven;
            # Mojang publishes new MC versions; shorter TTL prevents
            # locking out new releases.
            proxy_cache_valid 200 206 6h;
            proxy_cache_valid 404 5m;
            proxy_cache_key "piston-meta:$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------- Mojang libraries ---------------------------------
        location /mojang-libs/ {
            proxy_pass https://127.0.0.1:8010/;
            proxy_set_header Host libraries.minecraft.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name libraries.minecraft.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "mojang-libs:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------- CurseForge edge CDN ------------------------------
        location /forgecdn/ {
            proxy_pass https://127.0.0.1:8011/;
            proxy_set_header Host edge.forgecdn.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name edge.forgecdn.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "forgecdn:$uri";
            proxy_cache_use_stale error timeout updating http_502 http_503;
            proxy_read_timeout 300s;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ------- Modrinth CDN -------------------------------------
        location /modrinth-cdn/ {
            proxy_pass https://127.0.0.1:8012/;
            proxy_set_header Host cdn.modrinth.com;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name cdn.modrinth.com;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "modrinth-cdn:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # =========== Client-launcher (BMCLAPI-compatible) =========
        # Most HMCL-family launchers (HMCL, PCL, BakaXL, ...) speak the
        # BMCLAPI URL contract — point them at this mirror's base URL
        # and they map the official Mojang/Forge/Fabric domains onto
        # these paths automatically.

        # Mojang resources CDN — vanilla assets (sounds, lang files,
        # textures). Lots of small files; lacking this turns "launch
        # vanilla" into a "many small 403s" cascade on RU edge.
        location /assets/ {
            proxy_pass https://127.0.0.1:8013/;
            proxy_set_header Host resources.download.minecraft.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name resources.download.minecraft.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "assets:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # BMCLAPI alias: /libraries/<path> → libraries.minecraft.net.
        # Re-uses the same upstream relay (port 8010) as /mojang-libs/.
        location /libraries/ {
            proxy_pass https://127.0.0.1:8010/;
            proxy_set_header Host libraries.minecraft.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name libraries.minecraft.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "libraries:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # BMCLAPI alias: /maven/<path> → maven.minecraftforge.net.
        # Some launchers also probe BMCLAPI's /maven/ for community
        # mavens; we only point it at Forge's because that's the
        # disambiguated default.
        location /maven/ {
            proxy_pass https://127.0.0.1:8002/;
            proxy_set_header Host maven.minecraftforge.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.minecraftforge.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "maven-alias:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # /mc/game/version_manifest[_v2].json — entry point used by
        # almost every launcher's "auto" mode. Proxy to piston-meta;
        # 1 h cache window so a freshly released MC version doesn't
        # get locked out behind a stale cache.
        location ~ ^/mc/game/version_manifest(_v2)?\.json$ {
            proxy_pass https://127.0.0.1:8009$request_uri;
            proxy_set_header Host piston-meta.mojang.com;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name piston-meta.mojang.com;
            proxy_cache maven;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 5m;
            proxy_cache_key "version-manifest:$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Direct rewrites for HMCL/BMCLAPI download endpoints we know
        # the exact maven coordinates for. These win over the bmclapi
        # catch-all below because the location is more specific (longer
        # regex match), and crucially they NEVER round-trip through
        # bmclapi — which 302-redirects everything to its own storage
        # edge and occasionally 404s freshly cut loader versions.
        #
        # NeoForge installer: /neoforge/version/21.1.233/download/installer.jar
        # → https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.233/neoforge-21.1.233-installer.jar
        location ~ ^/neoforge/version/(?<nfv>[^/]+)/download/installer\.jar$ {
            proxy_pass https://127.0.0.1:8001/releases/net/neoforged/neoforge/$nfv/neoforge-$nfv-installer.jar;
            proxy_set_header Host maven.neoforged.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.neoforged.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "neoforge-installer:$nfv";
            proxy_cache_use_stale error timeout updating http_502 http_503;
            proxy_read_timeout 300s;
            proxy_connect_timeout 30s;
            add_header X-Cache-Status $upstream_cache_status;
        }
        # NeoForge universal: /neoforge/version/21.1.233/download/universal.jar
        location ~ ^/neoforge/version/(?<nfv2>[^/]+)/download/universal\.jar$ {
            proxy_pass https://127.0.0.1:8001/releases/net/neoforged/neoforge/$nfv2/neoforge-$nfv2-universal.jar;
            proxy_set_header Host maven.neoforged.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.neoforged.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "neoforge-universal:$nfv2";
            add_header X-Cache-Status $upstream_cache_status;
        }
        # Forge installer: /forge/version/<mcVer>-<forgeVer>/download/installer.jar
        # Maven path: net/minecraftforge/forge/<mcVer>-<forgeVer>/forge-<mcVer>-<forgeVer>-installer.jar
        location ~ ^/forge/version/(?<fv>[^/]+)/download/installer\.jar$ {
            proxy_pass https://127.0.0.1:8002/net/minecraftforge/forge/$fv/forge-$fv-installer.jar;
            proxy_set_header Host maven.minecraftforge.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.minecraftforge.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "forge-installer:$fv";
            add_header X-Cache-Status $upstream_cache_status;
        }
        location ~ ^/forge/version/(?<fv2>[^/]+)/download/universal\.jar$ {
            proxy_pass https://127.0.0.1:8002/net/minecraftforge/forge/$fv2/forge-$fv2-universal.jar;
            proxy_set_header Host maven.minecraftforge.net;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name maven.minecraftforge.net;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "forge-universal:$fv2";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # BMCLAPI API-mimic catch-all. Endpoints like /forge/list/<mc>,
        # /neoforge/list/<mc>, /optifine/<mc>, /liteloader/... aren't
        # real CDN paths — bmclapi synthesises them by parsing the
        # corresponding maven-metadata.xml and serving aggregated JSON
        # the HMCL-family launchers expect. We don't run that parser
        # ourselves, so for the small handful of API-mimic verbs we
        # forward straight to bmclapi (the canonical author) via the
        # gost relay — and inherit caching like everything else.
        # Regex location wins over the /neoforge/ prefix below for
        # paths matching this pattern (nginx evaluates `~` before
        # non-`^~` prefixes).
        location ~ ^/(forge|neoforge|optifine|liteloader|authlib-injector)/(list|minecraft|version|versions|download|loader)(/|$) {
            proxy_pass https://127.0.0.1:8014$request_uri;
            proxy_set_header Host bmclapi2.bangbang93.com;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name bmclapi2.bangbang93.com;
            proxy_cache maven;
            # Loader version lists drift as new builds publish — keep
            # the cache window short so a freshly cut Forge/NeoForge
            # release shows up in the launcher within an hour.
            proxy_cache_valid 200 1h;
            proxy_cache_valid 404 5m;
            proxy_cache_key "bmclapi:$request_uri";
            proxy_cache_use_stale error timeout updating http_502 http_503;
            proxy_read_timeout 60s;
            proxy_connect_timeout 30s;
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Cache-Origin "bmclapi";
        }

        # /v1/packages/<hash>/<ver>.json — per-version manifest. piston-
        # meta's canonical URL is the same shape, so it's a 1:1 pass-
        # through proxy, just with caching on top.
        location /v1/packages/ {
            proxy_pass https://127.0.0.1:8009/v1/packages/;
            proxy_set_header Host piston-meta.mojang.com;
            proxy_set_header User-Agent "cofemine-maven-cache/0.1";
            proxy_ssl_name piston-meta.mojang.com;
            proxy_cache maven;
            proxy_cache_valid 200 206 180d;
            proxy_cache_valid 404 5m;
            proxy_cache_key "v1-packages:$uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            return 404 "not a cache mapping\n";
            add_header Content-Type text/plain;
        }
    }
}
